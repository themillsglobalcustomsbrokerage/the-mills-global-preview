# Staff content editor (Sveltia CMS, Decap compatible). Open /admin/ and sign in with GitHub.
# Each save is a commit to this repo; a GitHub Action then rebuilds the article pages.
backend:
  name: github
  repo: themillsglobalcustomsbrokerage/the-mills-global-preview
  branch: main

media_folder: assets/images/blog
public_folder: /assets/images/blog

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: content/posts/articles
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - label: Category
        name: category
        widget: select
        options:
          - "Duties, Taxes and Fees"
          - "Compliance and Regulations"
          - "Customs Procedures"
          - "Importation Guides"
          - "Industry Guides"
          - "Trade Strategy"
          - "Accreditation and Registration"
          - "Documentation"
          - "Tariff and Classification"
          - "Import Permits and Agencies"
          - "Trade Agreements"
          - "Shipping and Logistics"
      - { label: Summary, name: summary, widget: text, hint: "One or two sentences. Shown on cards and in Google results." }
      - { label: Cover image, name: image, widget: image, required: false, hint: "Landscape, at least 1200 px wide. Leave empty to use a default image." }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: "Draft (keep unpublished)", name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown, hint: "Use Heading 2 and Heading 3 for sections. Link to other articles as /articles/their-slug." }
  - name: news
    label: News
    label_singular: News item
    folder: content/posts/news
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - label: Category
        name: category
        widget: select
        options:
          - "Market News"
          - "BOC Issuances"
          - "Compliance and Regulations"
          - "Industry"
          - "Customs"
          - "Duties, Taxes and Fees"
      - { label: Summary, name: summary, widget: text, hint: "One or two sentences. Shown on cards and in Google results." }
      - { label: Cover image, name: image, widget: image, required: false, hint: "Landscape, at least 1200 px wide. Leave empty to use a default image." }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: "Draft (keep unpublished)", name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown, hint: "Use Heading 2 and Heading 3 for sections. Link to other articles as /articles/their-slug." }
  - name: settings
    label: Weekly Exchange Rate
    files:
      - name: exchange_rate
        label: Customs exchange rate (update every Friday)
        file: content/exchange-rate.json
        fields:
          - { label: Currency pair, name: pair, widget: string, default: "USD to PHP" }
          - { label: "BSP reference rate (pesos per US dollar)", name: rate, widget: string, hint: "Type it with 4 decimals, as in the bulletin, e.g. 63.8520" }
          - { label: "Friday the rate was set", name: set_on, widget: string, pattern: ['^\\d{4}-\\d{2}-\\d{2}$', "Use YYYY-MM-DD, and pick a Friday"], hint: "Example: 2026-11-06. The page shows it applying from the next day (Saturday) until the following Friday." }
          - { label: Source, name: source, widget: string, default: "Bangko Sentral ng Pilipinas (BSP) Reference Exchange Rate Bulletin" }
          - { label: Source link, name: source_url, widget: string, default: "https://www.bsp.gov.ph/" }
          - label: Currency table (Phil. Peso equivalent from the bulletin)
            name: currencies
            widget: list
            fields:
              - { label: Country, name: country, widget: string }
              - { label: Code, name: code, widget: string }
              - { label: Peso equivalent, name: php, widget: string, hint: "As printed in the bulletin, e.g. 85.4404" }
          - { label: Note for staff, name: note, widget: text, required: false }
